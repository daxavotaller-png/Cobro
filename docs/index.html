<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesando transacción</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #202124;
    }

    .container {
      width: min(92%, 430px);
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    /* Pantalla de carga */
    #loading {
      display: block;
    }

    .spinner {
      width: 65px;
      height: 65px;
      margin: 10px auto 28px;
      border: 6px solid #e6e9ee;
      border-top-color: #3478f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .loading-text {
      color: #737981;
      font-size: 15px;
    }

    /* Resultado */
    #success {
      display: none;
    }

    .success-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #e7f7ed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #20a05a;
      font-size: 43px;
      font-weight: bold;
    }

    .success-title {
      font-size: 25px;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .success-subtitle {
      color: #6c727a;
      margin: 0 0 30px;
      font-size: 15px;
    }

    .amount {
      font-size: 42px;
      font-weight: 700;
      margin: 15px 0 30px;
      color: #17191c;
    }

    .details {
      border-top: 1px solid #e8eaed;
      padding-top: 20px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      font-size: 14px;
    }

    .detail-label {
      color: #777d85;
    }

    .detail-value {
      font-weight: 600;
    }

    .status {
      display: inline-block;
      margin-top: 22px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #e7f7ed;
      color: #18894b;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Pantalla inicial -->
    <div id="loading" class="card">
      <div class="spinner"></div>

      <div class="loading-title">
        Procesando transacción
      </div>

      <div class="loading-text">
        Estamos realizando tu pago. Por favor, espera...
      </div>
    </div>

    <!-- Pantalla de pago realizado -->
    <div id="success" class="card">

      <div class="success-icon">✓</div>

      <h1 class="success-title">
        Pago realizado correctamente
      </h1>

      <p class="success-subtitle">
        La transacción se ha completado.
      </p>

      <div class="amount">
        300,00 €
      </div>

      <div class="details">
        <div class="detail-row">
          <span class="detail-label">Estado</span>
          <span class="detail-value">Completado</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Importe</span>
          <span class="detail-value">300,00 €</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Concepto</span>
          <span class="detail-value">Pago</span>
        </div>
      </div>

      <div class="status">
        ✓ Transacción completada
      </div>

    </div>

  </div>

  <script>
    // Después de 5 segundos se muestra el resultado
    setTimeout(function () {
      document.getElementById("loading").style.display = "none";
      document.getElementById("success").style.display = "block";
    }, 3500);
  </script>

</body>
</html>
